<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     width="32"
     height="32"
     fill="none">

  <!-- category background -->
  <circle cx="16" cy="16" r="12" fill="#E8F5E9"/>

  <!-- plate -->
  <circle cx="16" cy="16.3" r="6.1"
          fill="#FFFFFF"
          stroke="#4CAF50"
          stroke-width="2.1"/>

  <!-- inner plate -->
  <circle cx="16" cy="16.3" r="3.4"
          stroke="#4CAF50"
          stroke-width="1.6"
          opacity="0.85"/>

  <!-- fork -->
  <path d="M7.9 9.6V14.1
           M10.3 9.6V14.1
           M7.9 12.1H10.3
           M9.1 14.1V22.6"
        stroke="#4CAF50"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- spoon -->
  <ellipse cx="23" cy="11.9"
           rx="1.8" ry="2.5"
           stroke="#4CAF50"
           stroke-width="1.9"/>

  <path d="M23 14.4V22.6"
        stroke="#4CAF50"
        stroke-width="1.9"
        stroke-linecap="round"/>
