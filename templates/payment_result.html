{# templates/payment_result.html — 토스 successUrl 착지 화면.
   토스가 넘겨준 paymentKey/orderId/amount 로 서버 승인(/api/payments/confirm)을 호출한다.
   승인 전까지는 결제가 확정된 것이 아니므로 "확인 중"으로만 표시한다. #}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 확인 중</title>
    <style>
        :root { --green:#4CAF50; --cream:#faf8f3; }
        body { margin:0; font-family:'Noto Sans KR',sans-serif; background:var(--cream); color:#253027;
               min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .box { max-width:420px; width:100%; padding:32px 24px; text-align:center; }
        .spinner { width:44px; height:44px; margin:0 auto 18px; border:4px solid #e2ece5;
                   border-top-color:var(--green); border-radius:50%; animation:spin .9s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        h1 { font-size:1.15rem; font-weight:800; margin:0 0 8px; }
        p { color:#6a746d; font-size:.92rem; margin:6px 0; }
        .err { color:#e5484d; font-weight:700; }
        .btn { display:inline-block; margin-top:18px; padding:13px 22px; border:none; border-radius:12px;
               background:var(--green); color:#fff; font-weight:800; font-size:.98rem;
               text-decoration:none; cursor:pointer; }
    </style>
</head>
<body>
<div class="box">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">결제를 확인하고 있어요</h1>
    <p id="desc">잠시만 기다려 주세요. 이 창을 닫지 마세요.</p>
    <a id="retry" class="btn" style="display:none;" href="{{ url_for('payment_page', app_id=app_id) }}">결제 화면으로 돌아가기</a>
</div>

<script id="confirm-data" type="application/json">{{ {
    'payment_key': payment_key, 'order_id': order_id, 'amount': amount
}|tojson|safe }}</script>
<script>
(function () {
    var D = JSON.parse(document.getElementById('confirm-data').textContent);
    var spinner = document.getElementById('spinner');
    var title = document.getElementById('title');
    var desc = document.getElementById('desc');
    var retry = document.getElementById('retry');

    function showError(msg) {
        spinner.style.display = 'none';
        title.textContent = '결제를 완료하지 못했어요';
        desc.className = 'err';
        desc.textContent = msg;
        retry.style.display = 'inline-block';
    }

    if (!D.payment_key || !D.order_id || !D.amount) {
        showError('결제 정보가 올바르지 않습니다.');
        return;
    }

    fetch('/api/payments/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ paymentKey: D.payment_key, orderId: D.order_id, amount: D.amount })
    }).then(function (r) { return r.json(); }).then(function (res) {
        if (res.success && res.data && res.data.redirect) {
            window.location.replace(res.data.redirect);
        } else {
            showError((res.error && res.error.message) || '결제 승인에 실패했습니다.');
        }
    }).catch(function () {
        showError('결제 승인 중 통신 오류가 발생했습니다. 예약 내역에서 상태를 확인해 주세요.');
    });
})();
</script>
</body>
</html>
