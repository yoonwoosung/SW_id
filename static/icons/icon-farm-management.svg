        fill="#4CAF50"/>

  <!-- small management gear -->
  <g transform="translate(21.6 20.9)">
    <circle cx="0" cy="0" r="3.1" fill="#4CAF50"/>
    <circle cx="0" cy="0" r="1.15" fill="#FFFFFF"/>

    <path d="M0 -4V-3.1
             M0 3.1V4
             M-4 0H-3.1
             M3.1 0H4
             M-2.8 -2.8L-2.2 -2.2
             M2.2 2.2L2.8 2.8
             M2.8 -2.8L2.2 -2.2
             M-2.2 2.2L-2.8 2.8"
          stroke="#4CAF50"
          stroke-width="1.2"
          stroke-linecap="round"/>
  </g>
</svg>
