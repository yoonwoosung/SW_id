<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     width="32"
     height="32"
     fill="none">

  <circle cx="16" cy="16" r="12" fill="#E8F5E9"/>

  <!-- clock face -->
  <circle cx="16" cy="16" r="8.2"
          fill="#FFFFFF"
          stroke="#4CAF50"
          stroke-width="2.2"/>

  <!-- hands -->
  <path d="M16 11.2V16.2L19.5 18.3"
        stroke="#4CAF50"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- center -->
  <circle cx="16" cy="16" r="1.1" fill="#4CAF50"/>

  <!-- subtle hour marks -->
  <path d="M16 8.7V9.6
           M16 22.4V23.3
           M8.7 16H9.6
           M22.4 16H23.3"
        stroke="#4CAF50"
        stroke-width="1.5"
        stroke-linecap="round"/>
</svg>
