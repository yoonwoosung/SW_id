{% extends "layout.html" %}
{% block content %}
<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="fa-regular fa-calendar-days text-success mr-2"></i>농장 예약 달력</h2>
        <a href="{{ url_for('farmer_easy_mode') }}" class="btn btn-outline-secondary btn-sm">
            <i class="fa-solid fa-arrow-left mr-1"></i> 대시보드로 돌아가기
        </a>
    </div>

    <div class="card shadow-sm p-3 bg-white rounded">
        <!-- 툴바 영역 (월/주/일/오늘, 날짜 이동, 오늘의 일정 버튼) -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <!-- 좌측: 월 / 주 / 일 / 오늘 탭 -->
            <div class="btn-group mb-2 mb-md-0" role="group">
                <button type="button" class="btn btn-outline-primary active" id="view-month-btn">월</button>
                <button type="button" class="btn btn-outline-primary" id="view-week-btn">주</button>
                <button type="button" class="btn btn-outline-primary" id="view-day-btn">일</button>
                <button type="button" class="btn btn-outline-secondary ml-1" id="view-today-btn">오늘</button>
            </div>

            <!-- 중앙: 날짜 이동 버튼 & 타이틀 -->
            <div class="d-flex align-items-center mb-2 mb-md-0">
                <button type="button" class="btn btn-sm btn-light border mr-2" id="cal-prev-btn">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <h4 class="mb-0 font-weight-bold px-2 text-dark" id="cal-title-display">2026년 8월</h4>
                <button type="button" class="btn btn-sm btn-light border ml-2" id="cal-next-btn">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <!-- 우측: 오늘의 일정 탭 버튼 -->
            <div>
                <button type="button" class="btn btn-outline-info" id="view-agenda-btn">
                    <i class="fa-solid fa-list-check mr-1"></i> 오늘의 일정
                </button>
            </div>
        </div>

        <!-- FullCalendar가 렌더링될 영역 -->
        <div id="full-calendar-container" style="min-height: 650px;"></div>
    </div>
</div>

<!-- 예약 정보 숨김 데이터 -->
<div id="reservations-data" style="display:none;">{{ reservations_data | tojson | safe }}</div>

<!-- 예약 상세 팝업 모달 -->
<div id="cal-modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:9999; align-items:center; justify-content:center;">
    <div id="cal-modal-box" style="background:#fff; border-radius:var(--fl-radius-lg); padding:var(--fl-s5); max-width:480px; width:90%; max-height:80vh; overflow-y:auto; box-shadow:0 8px 32px rgba(0,0,0,.18);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--fl-s4);">
            <div>
                <div id="cal-modal-date" style="font-size:.85rem; color:var(--fl-text-muted); margin-bottom:2px;"></div>
                <h3 id="cal-modal-title" style="margin:0; font-size:1.15rem; font-weight:800; color:var(--fl-text);"></h3>
            </div>
            <button id="cal-modal-close" style="background:none; border:none; font-size:1.6rem; line-height:1; cursor:pointer; color:var(--fl-text-muted); padding:0 4px;">&times;</button>
        </div>
        <div id="cal-modal-summary" style="background:var(--fl-surface-2); border-radius:var(--fl-radius); padding:12px 16px; margin-bottom:var(--fl-s4); font-size:.95rem;"></div>
        <div id="cal-modal-body"></div>
    </div>
</div>

<!-- FullCalendar 6 라이브러리 CDN -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const rawData = JSON.parse(document.getElementById('reservations-data').textContent || '{}');
    const calendarEl = document.getElementById('full-calendar-container');

    // ===== 체험별 색상 팔레트 =====
    const COLORS = [
        { bg: '#4CAF50', border: '#388E3C' },
        { bg: '#ea6a1e', border: '#b85316' },
        { bg: '#2196F3', border: '#1565C0' },
        { bg: '#9C27B0', border: '#6A1B9A' },
        { bg: '#E91E63', border: '#AD1457' },
        { bg: '#00ACC1', border: '#00838F' },
        { bg: '#FF7043', border: '#D84315' },
        { bg: '#5C6BC0', border: '#3949AB' },
    ];
    const cropColorMap = {};
    let colorIdx = 0;
    function getColor(crop) {
        if (!cropColorMap[crop]) {
            cropColorMap[crop] = COLORS[colorIdx % COLORS.length];
            colorIdx++;
        }
        return cropColorMap[crop];
    }

    // ===== 같은 날 같은 체험 인원 합치기 =====
    const grouped = {};
    for (const dateKey in rawData) {
        rawData[dateKey].forEach(res => {
            const key = dateKey + '__' + res.crop;
            if (!grouped[key]) {
                grouped[key] = { dateKey, crop: res.crop, adult: 0, teen: 0, child: 0, reservations: [] };
            }
            grouped[key].adult += (res.adult || 0);
            grouped[key].teen  += (res.teen  || 0);
            grouped[key].child += (res.child || 0);
            grouped[key].reservations.push(res);
        });
    }

    // ===== FullCalendar 이벤트 생성 =====
    const eventsList = [];
    for (const key in grouped) {
        const g = grouped[key];
        const total = g.adult + g.teen + g.child;
        const color = getColor(g.crop);
        eventsList.push({
            title: g.crop + ' (' + total + '명)',
            start: g.dateKey,
            backgroundColor: color.bg,
            borderColor: color.border,
            textColor: '#fff',
            extendedProps: {
                crop: g.crop,
                dateKey: g.dateKey,
                totalAdult: g.adult,
                totalTeen: g.teen,
                totalChild: g.child,
                total: total,
                reservations: g.reservations,
                color: color.bg
            }
        });
    }

    // ===== 모달 =====
    const overlay  = document.getElementById('cal-modal-overlay');
    const modalTitle   = document.getElementById('cal-modal-title');
    const modalDate    = document.getElementById('cal-modal-date');
    const modalSummary = document.getElementById('cal-modal-summary');
    const modalBody    = document.getElementById('cal-modal-body');

    function openModal(props) {
        const dateStr = props.dateKey.replace(/-/g, '.');
        modalDate.textContent = dateStr;
        modalTitle.textContent = props.crop;
        modalTitle.style.color = props.color;

        modalSummary.innerHTML =
            '총 <strong>' + props.total + '명</strong> 예약' +
            ' &nbsp;·&nbsp; 성인 ' + props.totalAdult +
            ' · 청소년 ' + props.totalTeen +
            ' · 아동 ' + props.totalChild;

        modalBody.innerHTML = props.reservations.map(function(res) {
            const cnt = (res.adult || 0) + (res.teen || 0) + (res.child || 0);
            return '<div style="padding:12px 0; border-bottom:1px solid var(--fl-border);">' +
                '<div style="font-weight:700; font-size:.98rem;">' + res.name + ' 님</div>' +
                '<div style="font-size:.88rem; color:var(--fl-text-muted); margin-top:2px;">' +
                    (res.time || '시간 미지정') + ' &nbsp;·&nbsp; 총 ' + cnt + '명' +
                    ' (성인 ' + (res.adult||0) + ' · 청소년 ' + (res.teen||0) + ' · 아동 ' + (res.child||0) + ')' +
                '</div>' +
                '<div style="font-size:.85rem; color:var(--fl-text-muted); margin-top:2px;">' + (res.phone || '') + '</div>' +
            '</div>';
        }).join('') + '<div style="height:4px;"></div>';

        overlay.style.display = 'flex';
    }

    document.getElementById('cal-modal-close').addEventListener('click', function() {
        overlay.style.display = 'none';
    });
    overlay.addEventListener('click', function(e) {
        if (e.target === overlay) overlay.style.display = 'none';
    });

    // ===== FullCalendar 초기화 =====
    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'ko',
        headerToolbar: false,
        noEventsText: '등록된 예정된 일정이 없습니다.',
        events: eventsList,
        editable: false,
        dayMaxEvents: true,
        datesSet: function(info) {
            document.getElementById('cal-title-display').textContent = info.view.title;
        },
        eventClick: function(info) {
            openModal(info.event.extendedProps);
        }
    });

    calendar.render();

    // 뷰 전환 버튼 액션 및 활성화 스타일 변경 함수
    function setActiveButton(activeBtn) {
        [
            document.getElementById('view-month-btn'),
            document.getElementById('view-week-btn'),
            document.getElementById('view-day-btn'),
            document.getElementById('view-agenda-btn')
        ].forEach(btn => {
            if (btn) {
                btn.classList.remove('active', 'btn-primary', 'btn-info');
                if (btn.id === 'view-agenda-btn') {
                    btn.classList.add('btn-outline-info');
                } else {
                    btn.classList.add('btn-outline-primary');
                }
            }
        });

        if (activeBtn) {
            if (activeBtn.id === 'view-agenda-btn') {
                activeBtn.classList.remove('btn-outline-info');
                activeBtn.classList.add('btn-info', 'active');
            } else {
                activeBtn.classList.remove('btn-outline-primary');
                activeBtn.classList.add('btn-primary', 'active');
            }
        }
    }

    // 버튼 이벤트 리스너 연결
    document.getElementById('view-month-btn').addEventListener('click', function() {
        calendar.changeView('dayGridMonth');
        setActiveButton(this);
    });

    document.getElementById('view-week-btn').addEventListener('click', function() {
        calendar.changeView('timeGridWeek');
        setActiveButton(this);
    });

    document.getElementById('view-day-btn').addEventListener('click', function() {
        calendar.changeView('timeGridDay');
        setActiveButton(this);
    });

    document.getElementById('view-agenda-btn').addEventListener('click', function() {
        calendar.changeView('listMonth');
        setActiveButton(this);
    });

    document.getElementById('view-today-btn').addEventListener('click', function() {
        calendar.today();
    });

    document.getElementById('cal-prev-btn').addEventListener('click', function() {
        calendar.prev();
    });

    document.getElementById('cal-next-btn').addEventListener('click', function() {
        calendar.next();
    });
});
</script>
{% endblock %}
