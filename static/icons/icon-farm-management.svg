<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     width="32"
     height="32"
     fill="none">

  <!-- soft background -->
  <circle cx="16" cy="16" r="12" fill="#E8F5E9"/>

  <!-- farm roof -->
  <path d="M7.5 14L16 8.5L24.5 14"
        stroke="#4CAF50"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- farm body -->
  <rect x="9.2" y="14" width="13.6" height="9.5" rx="2.2"
        fill="#FFFFFF"
        stroke="#4CAF50"
        stroke-width="2"/>

  <!-- door -->
