{% extends "layout.html" %}
{% block head %}
<style>
/* ─── 앨범 뷰어 모달 ─── */
.album-viewer-modal { position:fixed; inset:0; z-index:2000; display:flex; align-items:center; justify-content:center; }
.av-overlay { position:absolute; inset:0; background:rgba(0,0,0,.72); }
.av-dialog {
    position:relative; z-index:1; background:#e8e8e8;
    border-radius:20px; padding:28px 28px 0;
    display:flex; flex-direction:column; align-items:center;
    gap:14px; max-width:96vw; max-height:96vh; overflow:hidden;
    box-shadow:0 12px 48px rgba(0,0,0,.4);
}
.av-close {
    position:absolute; top:10px; right:14px; background:none; border:none;
    font-size:1.8rem; color:#666; cursor:pointer; line-height:1; z-index:10;
}
.av-close:hover { color:#222; }
.av-book-row { display:flex; align-items:center; gap:18px; flex-shrink:0; }
.av-nav-btn {
    background:rgba(255,255,255,.9); border:1px solid #ddd; border-radius:50%;
    width:44px; height:44px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:1rem; flex-shrink:0; transition:background .15s;
}
.av-nav-btn:hover { background:#fff; }
.av-nav-btn:disabled { opacity:.3; cursor:default; }
.av-album-title { font-weight:800; font-size:.95rem; color:#333; text-align:center; flex-shrink:0; }

/* ─── 썸네일 스트립 (뷰어 & 에디터 공용) ─── */
.av-thumb-strip, .editor-thumb-strip {
    display:flex; gap:10px; overflow-x:auto; padding:10px 4px 12px;
    background:#dadada; border-top:1px solid #c4c4c4;
    scrollbar-width:thin; scrollbar-color:#bbb #ddd;
    flex:1; min-width:0;
}
/* 에디터 썸네일 래퍼 (스크롤 버튼 포함) */
.editor-thumb-wrap {
    display:flex; align-items:center;
    background:#dadada; border-top:2px solid #bbb;
    flex-shrink:0; padding:0 2px;
}
.et-scroll-btn {
    flex-shrink:0; background:none; border:none; cursor:pointer;
    color:#888; font-size:.85rem; padding:0 8px; align-self:stretch;
    display:flex; align-items:center; transition:color .15s;
}
.et-scroll-btn:hover { color:#333; }
.av-thumb, .et-thumb {
    flex-shrink:0; cursor:pointer; display:flex; flex-direction:column;
    align-items:center; gap:5px; padding:3px; border-radius:6px;
    transition:opacity .15s;
}
.av-thumb:hover, .et-thumb:hover { opacity:.8; }
.av-thumb.is-active .av-thumb-spread, .et-thumb.is-active .et-thumb-spread {
    outline:2.5px solid #e53935; outline-offset:1px;
}
.av-thumb-spread, .et-thumb-spread {
    display:flex; border-radius:5px; overflow:hidden;
    box-shadow:0 1px 5px rgba(0,0,0,.25); height:56px;
}
.av-thumb-page, .et-thumb-page {
    width:38px; height:56px; background:#f5f5f5;
    background-size:cover; background-position:center; flex-shrink:0;
}
.av-thumb-page.is-single, .et-thumb-page.is-single { width:52px; }
.av-spine { width:2px; background:#c8c8c8; flex-shrink:0; }
.av-thumb-label, .et-thumb-label {
    font-size:.65rem; color:#666; font-weight:700; white-space:nowrap;
}
</style>
{% endblock %}
{% block content %}

<!-- PDF 및 캔버스 라이브러리 -->
<script src="{{ url_for('static', filename='js/html2canvas.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/html2pdf.bundle.min.js') }}"></script>

<!-- ===== 앨범 목록 화면 (1200px, 최초 진입 시 표시) ===== -->
<div class="main-content-wrapper" id="album-landing" style="padding-top:var(--fl-s5);padding-bottom:60px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
        <div>
            <h1 style="font-size:1.5rem;font-weight:800;color:var(--green-dark);margin:0 0 4px;">
                <i data-lucide="book-open"></i> 내 추억 앨범
            </h1>
            <p style="color:#717171;font-size:.9rem;margin:0;">농촌 체험의 소중한 기억을 담은 나만의 포토북</p>
        </div>
        <button type="button" onclick="startNewAlbum()"
            style="background:var(--green-dark);color:#fff;border:none;border-radius:10px;
                   padding:10px 20px;font-size:.95rem;font-weight:800;cursor:pointer;
                   display:inline-flex;align-items:center;gap:6px;flex-shrink:0;">
            <i data-lucide="plus"></i> 새 앨범 만들기
        </button>
    </div>

    <!-- 앨범 카드 그리드 -->
    <div id="album-list-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;">
        <!-- JS로 렌더링 -->
    </div>
</div>

<!-- ===== 에디터 (Miri Canvas 스타일, 시작 버튼 클릭 후 표시) ===== -->
<!-- 하트 모양 clip-path 정의 (objectBoundingBox = 0~1 좌표로 요소 크기에 맞게 자동 스케일) -->
<svg width="0" height="0" style="position:absolute;overflow:hidden;">
    <defs>
        <clipPath id="shape-clip-heart" clipPathUnits="objectBoundingBox">
            <path d="M0.5,0.27 C0.5,0.15 0.37,0.04 0.22,0.04 C0.07,0.04 0,0.18 0,0.28 C0,0.48 0.18,0.62 0.5,0.85 C0.82,0.62 1,0.48 1,0.28 C1,0.18 0.93,0.04 0.78,0.04 C0.63,0.04 0.5,0.15 0.5,0.27 Z"/>
        </clipPath>
    </defs>
</svg>

<div class="ae-wrap" id="album-editor" style="display:none;">

    <!-- 3단 레이아웃: 아이콘바 | 패널 | 캔버스 -->
    <div class="ae-layout">

        <!-- 아이콘 사이드바 (64px) -->
        <div class="ae-icon-nav">
            <button class="ae-icon active" id="ae-icon-design" type="button" onclick="switchAeTab('design')" title="디자인">
                <i class="fa-solid fa-palette"></i>
                <span>디자인</span>
            </button>
            <button class="ae-icon" id="ae-icon-photo" type="button" onclick="switchAeTab('photo')" title="사진">
                <i class="fa-solid fa-images"></i>
                <span>사진</span>
            </button>
            <button class="ae-icon" id="ae-icon-text" type="button" onclick="switchAeTab('text')" title="텍스트">
                <i class="fa-solid fa-font"></i>
                <span>텍스트</span>
            </button>
        </div>

        <!-- 콘텐츠 패널 (280px) -->
        <div class="ae-panel">

            <!-- 디자인 패널 -->
            <div class="ae-panel-content" id="ae-panel-design">
                <p class="ae-panel-title">디자인 & 레이아웃</p>
                <div class="ae-form-group">
                    <label class="ae-label">다녀온 체험 정보</label>
                    <select id="albumExpSelect" class="form-control form-control-sm" onchange="autoFillTitle(this)">
                        <option value="">-- 체험 선택 --</option>
                        {% if applications %}
                        {% for app in applications %}
                        {% if app.experience %}
                        <option value="{{ app.experience.crop }}" data-location="{{ app.experience.address_detail }}">
                            [{{ app.apply_date.strftime('%Y.%m.%d') }}] {{ app.experience.crop }}
                        </option>
                        {% endif %}
                        {% endfor %}
                        {% else %}
                        <option value="농촌 수확 체험" data-location="충청남도 천안시">천안 딸기 수확 체험 (샘플)</option>
                        {% endif %}
                    </select>
                </div>
                <div class="ae-form-group">
                    <label class="ae-label">앨범 모양 / 규격</label>
                    <select id="shapeThemeSelect" class="form-control form-control-sm" onchange="changeShapeTheme(this.value)">
                        <option value="shape-portrait">세로형 앨범</option>
                        <option value="shape-square">정사각형 앨범(Square)</option>
                        <option value="shape-landscape">가로형 앨범</option>
                    </select>
                </div>
                <div class="ae-form-group">
                    <label class="ae-label">겉표지 디자인</label>
                    <select id="coverThemeSelect" class="form-control form-control-sm" onchange="changeCoverTheme(this.value)">
                        <option value="cover-green">초록색</option>
                        <option value="cover-leather">가죽</option>
                        <option value="cover-linen">살구색</option>
                        <option value="cover-navy">남색</option>
                    </select>
                </div>
                <div class="ae-form-group">
                    <label class="ae-label">속지 종이 재질</label>
                    <select id="paperThemeSelect" class="form-control form-control-sm" onchange="changePaperTheme(this.value)">
                        <option value="paper-white">📄 흰종이</option>
                        <option value="paper-cream">📜 한지</option>
                        <option value="paper-kraft">📦 종이 상자</option>
                        <option value="paper-grid">▦ 모눈 격자</option>
                    </select>
                </div>
                <div class="ae-form-group">
                    <label class="ae-label">앨범 레이아웃 틀</label>
                    <select id="layoutTemplateSelect" class="form-control form-control-sm" onchange="applyLayoutTemplate(this.value)">
                        <option value="free">✨ 자유 배치 (기본)</option>
                        <option value="grid4">🖼️ 4컷 클래식 레이아웃</option>
                        <option value="hero1">📸 메인 1컷 + 소형 2컷</option>
                        <option value="diary">📖 여행 일기 (사진 + 메모)</option>
                        <option value="fullPage">🖼️ 1페이지 풀채움</option>
                        <option value="fullSpread">🌅 양면 파노라마</option>
                        <option value="centerCross">🏞️ 중앙 연결 파노라마</option>
                        <option value="photoStory">✍️ 감성 스토리</option>
                    </select>
                </div>
            </div>

            <!-- 사진 패널 -->
            <div class="ae-panel-content" id="ae-panel-photo" style="display:none;">
                <p class="ae-panel-title">사진 보관함</p>
                <div class="ae-form-group">
                    <label class="ae-label">사진 업로드 (5~20장)</label>
                    <input type="file" id="photoUploader" class="form-control-file border p-1 rounded small"
                        multiple accept="image/*" onchange="handlePhotoUpload(event)">
                    <small id="photoCountNotice" class="text-info d-block mt-1" style="font-size:.72rem;">* 최소 5장 이상 권장합니다.</small>
                </div>
                <div class="ae-form-group">
                    <label class="ae-label">클릭하면 앨범에 추가</label>
                    <div id="photoTray" class="d-flex flex-wrap gap-2 p-2 bg-light border rounded style-scroll"
                        style="min-height:180px;max-height:320px;overflow-y:auto;">
                        <span class="text-muted small m-auto" id="emptyTrayText">사진을 올려주세요</span>
                    </div>
                </div>
            </div>

            <!-- 텍스트 패널 -->
            <div class="ae-panel-content" id="ae-panel-text" style="display:none;">
                <p class="ae-panel-title">텍스트 스튜디오</p>
                <button type="button" class="btn btn-outline-success btn-block font-weight-bold py-2 mb-3"
                    onclick="addTextBoxToActivePage()">
                    <i class="fa-solid fa-plus mr-1"></i> 텍스트 상자 추가
                </button>
                <div class="p-3 bg-light border rounded" style="font-size:.78rem;color:#666;line-height:1.7;">
                    <div style="font-weight:700;margin-bottom:6px;color:#444;">✏️ 편집 팁</div>
                    <ul class="pl-3 mb-0">
                        <li>텍스트 상자를 드래그하여 이동</li>
                        <li>🔄 핸들로 360도 회전 가능</li>
                        <li>더블클릭하여 내용 수정</li>
                    </ul>
                </div>
            </div>

        </div>

        <!-- 캔버스 영역 -->
        <div class="ae-canvas-area">

            <!-- topbar: 목록·제목·저장·PDF (캔버스 상단) -->
            <div class="ae-topbar">
                <button class="ae-topbar-back" type="button"
                    onclick="if(confirm('저장하지 않은 변경사항은 사라집니다. 목록으로 돌아갈까요?')) showAlbumList();">
                    <i class="fa-solid fa-chevron-left"></i> 목록
                </button>
                <div class="ae-topbar-divider"></div>
                <span class="ae-topbar-title" id="ae-title-display" onclick="startTitleEdit()" title="클릭하여 제목 수정">새 앨범</span>
                <button type="button" class="ae-title-edit-btn" onclick="startTitleEdit()" title="제목 수정">
                    <i class="fa-solid fa-pencil"></i>
                </button>
                <input type="text" id="ae-title-input" class="ae-title-input" maxlength="20"
                    style="display:none;" onblur="commitTitleEdit()" onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){cancelTitleEdit();}">
                <div style="margin-left:auto;display:flex;gap:8px;">
                    <button class="ae-topbar-btn" type="button" onclick="saveAlbum()">
                        <i class="fa-solid fa-floppy-disk"></i> 저장
                    </button>
                    <button class="ae-topbar-btn ae-topbar-btn--primary" type="button" onclick="downloadBookPDF(event)">
                        <i class="fa-solid fa-file-pdf"></i> PDF 발급
                    </button>
                </div>
            </div>

            <!-- 사진 선택 시 나타나는 모양 선택 바 -->
            <div id="shape-context-bar" class="shape-context-bar" hidden>
                <span class="shape-context-label">사진 모양</span>
                <div class="shape-context-btns" id="shape-context-btns"></div>
            </div>

            <!-- 책 + 이전/다음 버튼 -->
            <div class="ae-book-row">
                <button type="button" class="ae-nav-btn" id="bookPrevBtn" onclick="prevPage()" title="이전 페이지">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <div class="ae-book-stage">
                    <div id="bookContainer" class="book-container cover-green paper-white shape-portrait">
                        <!-- JS에 의해 동적 렌더링 -->
                    </div>
                </div>
                <button type="button" class="ae-nav-btn" id="bookNextBtn" onclick="nextPage()" title="다음 페이지">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <!-- 에디터 페이지 썸네일 스트립 -->
            <div class="editor-thumb-wrap">
                <button type="button" class="et-scroll-btn" onclick="scrollEditorThumbs(-1)" title="이전">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <div class="editor-thumb-strip" id="editor-thumb-strip"></div>
                <button type="button" class="et-scroll-btn" onclick="scrollEditorThumbs(1)" title="다음">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

        </div>

    </div>
</div>

<!-- ===== 앨범 뷰어 모달 ===== -->
<div id="album-viewer-modal" class="album-viewer-modal" style="display:none;">
    <div class="av-overlay" onclick="closeAlbumViewer()"></div>
    <div class="av-dialog">
        <button class="av-close" onclick="closeAlbumViewer()" title="닫기">×</button>
        <div class="av-book-row">
            <button class="av-nav-btn" id="av-prev-btn" onclick="viewerPrevSpread()">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="ae-book-stage" id="av-book-stage">
                <div id="av-book-container" class="book-container cover-green paper-white shape-portrait"></div>
            </div>
            <button class="av-nav-btn" id="av-next-btn" onclick="viewerNextSpread()">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
        <div class="av-album-title" id="av-album-title"></div>
        <div class="av-thumb-strip" id="av-thumb-strip"></div>
    </div>
</div>

<script>
    function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }

    // ===== localStorage 앨범 관리 =====
    var FL_ALBUMS_KEY = 'fl_albums';

    // ── 사진 모양 정의 ──────────────────────────────────────────
    var SHAPES = [
        { id: 'rect',    label: '■', title: '기본',   clip: 'none' },
        { id: 'circle',  label: '●', title: '원형',   clip: 'circle(50%)' },
        { id: 'star',    label: '★', title: '별',     clip: 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)' },
        { id: 'heart',   label: '♥', title: '하트',   clip: 'url(#shape-clip-heart)' },
        { id: 'hexagon', label: '⬡', title: '육각형', clip: 'polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%)' },
        { id: 'diamond', label: '◆', title: '다이아', clip: 'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)' },
    ];

    // 현재 선택된 요소 추적
    var selectedElemId = null;
    var selectedElemPageIdx = null;

    function initShapeContextBar() {
        var btns = document.getElementById('shape-context-btns');
        if (!btns) return;
        btns.innerHTML = SHAPES.map(function(s) {
            return '<button type="button" class="shape-btn" data-shape="' + s.id + '" title="' + s.title + '" onclick="applyElementShape(null,null,\'' + s.id + '\')">' + s.label + '</button>';
        }).join('');
    }

    function showShapeContextBar(elemId, pageIdx, currentShape) {
        selectedElemId = elemId;
        selectedElemPageIdx = pageIdx;
        var bar = document.getElementById('shape-context-bar');
        if (!bar) return;
        bar.hidden = false;
        // active 상태 갱신
        bar.querySelectorAll('.shape-btn').forEach(function(btn) {
            btn.classList.toggle('shape-btn-active', btn.dataset.shape === (currentShape || 'rect'));
        });
    }

    function hideShapeContextBar() {
        selectedElemId = null;
        selectedElemPageIdx = null;
        var bar = document.getElementById('shape-context-bar');
        if (bar) bar.hidden = true;
    }

    function applyElementShape(elemId, pageIdx, shapeId) {
        // 인자 없으면 현재 선택된 요소에 적용
        var id  = elemId  || selectedElemId;
        var idx = (pageIdx !== null && pageIdx !== undefined) ? pageIdx : selectedElemPageIdx;
        if (!id || idx === null || idx === undefined) return;

        var data = albumPagesData[idx].elements.find(function(el) { return el.id === id; });
        if (!data) return;
        data.shape = shapeId;

        var shape = SHAPES.find(function(s) { return s.id === shapeId; });
        if (!shape) return;

        // 클립 대상: slot → .photo-slot-card, image → img
        var wrapper = document.getElementById(id);
        if (!wrapper) return;
        var clipTarget = wrapper.querySelector('.photo-slot-card') || wrapper.querySelector('img');
        if (clipTarget) clipTarget.style.clipPath = shape.clip;

        // 컨텍스트 바 active 갱신
        var bar = document.getElementById('shape-context-bar');
        if (bar) {
            bar.querySelectorAll('.shape-btn').forEach(function(btn) {
                btn.classList.toggle('shape-btn-active', btn.dataset.shape === shapeId);
            });
        }
    }
    var currentAlbumId = null;

    var COVER_COLORS = {
        'cover-green': '#4CAF50', 'cover-leather': '#8B5E3C',
        'cover-linen': '#E8B89A', 'cover-navy': '#1a2d5a'
    };

    function getAllAlbums() {
        try { return JSON.parse(localStorage.getItem(FL_ALBUMS_KEY) || '[]'); }
        catch(e) { return []; }
    }

    function saveAllAlbums(list) {
        localStorage.setItem(FL_ALBUMS_KEY, JSON.stringify(list));
    }

    function renderAlbumList() {
        var grid = document.getElementById('album-list-grid');
        var albums = getAllAlbums();
        var html = '';

        if (albums.length === 0) {
            html = '<div style="grid-column:1/-1;text-align:center;padding:60px 0;color:#9aa39c;">'
                + '<div style="font-size:3rem;margin-bottom:12px;">📖</div>'
                + '<div style="font-weight:700;font-size:1rem;margin-bottom:6px;">아직 만든 앨범이 없어요</div>'
                + '<div style="font-size:.9rem;">"새 앨범 만들기" 버튼으로 첫 앨범을 만들어 보세요!</div>'
                + '</div>';
        } else {
            albums.forEach(function(album) {
                var color = COVER_COLORS[album.coverTheme] || '#4CAF50';
                var dateStr = album.updatedAt ? album.updatedAt.slice(0, 10) : '';
                html += '<div style="border:1px solid #eef1ee;border-radius:14px;overflow:hidden;background:#fff;'
                    + 'box-shadow:0 2px 8px rgba(0,0,0,.06);">'
                    + '<div style="height:120px;background:' + color + ';display:flex;align-items:center;justify-content:center;'
                    + 'color:#fff;font-size:.8rem;font-weight:700;flex-direction:column;gap:6px;">'
                    + '<i class="fa-solid fa-book-open" style="font-size:2rem;"></i>'
                    + '<span>' + esc(album.title || '제목 없음') + '</span>'
                    + '</div>'
                    + '<div style="padding:12px 14px;">'
                    + '<div style="font-weight:800;font-size:.95rem;color:#253027;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'
                    + esc(album.title || '제목 없음') + '</div>'
                    + '<div style="font-size:.78rem;color:#9aa39c;margin-bottom:12px;">' + dateStr + ' 수정</div>'
                    + '<div style="display:flex;gap:8px;">'
                    + '<button onclick="openAlbumViewer(\'' + album.id + '\')" '

    function loadAlbum(id) {
        var albums = getAllAlbums();
        var album = albums.find(function(a) { return a.id === id; });
        if (!album) { alert('앨범을 찾을 수 없어요.'); return; }

        currentAlbumId = id;
        shapeTheme = album.shapeTheme || 'shape-portrait';
        coverTheme = album.coverTheme || 'cover-green';
        paperTheme = album.paperTheme || 'paper-white';
        innerPageCount = album.innerPageCount || 2;
        currentSpreadIndex = 0;
        albumPagesData = album.pagesData || Array.from({ length: 12 }, function() { return { title: '', elements: [], template: 'free' }; });

        // 사이드바 셀렉트 동기화
        var s = document.getElementById('shapeThemeSelect');
        var c = document.getElementById('coverThemeSelect');
        var p = document.getElementById('paperThemeSelect');
        if (s) s.value = shapeTheme;
        if (c) c.value = coverTheme;
        if (p) p.value = paperTheme;

        startAlbumEditor();
        renderBookView();
        updateTitleDisplay();
    }

    function saveAlbum() {
        var titleInput = document.getElementById('coverTitleInput');
        var title = (titleInput ? titleInput.value : '') || albumPagesData[0].title || '제목 없음';
        albumPagesData[0].title = title;

        var albums = getAllAlbums();
        var now = new Date().toISOString();
        var idx = albums.findIndex(function(a) { return a.id === currentAlbumId; });

        var albumData = {
            id: currentAlbumId,
            title: title,
            shapeTheme: shapeTheme,
            coverTheme: coverTheme,
            paperTheme: paperTheme,
            innerPageCount: innerPageCount,
            pagesData: albumPagesData,
            updatedAt: now
        };

        if (idx >= 0) {
            albumData.createdAt = albums[idx].createdAt;
            albums[idx] = albumData;
        } else {
            albumData.createdAt = now;
            albums.unshift(albumData);
        }

        saveAllAlbums(albums);
        alert('앨범이 저장되었어요!');
    }

    function deleteAlbum(id) {
        if (!confirm('앨범을 삭제할까요? 이 작업은 되돌릴 수 없어요.')) return;
        var albums = getAllAlbums().filter(function(a) { return a.id !== id; });
        saveAllAlbums(albums);
        renderAlbumList();
        if (window.lucide) lucide.createIcons();
    }

    function selectPage(pIdx) {
        if (pIdx !== 0 && pIdx > innerPageCount) return;
        selectedPageIndex = pIdx;
        document.querySelectorAll('.book-page').forEach(p => p.classList.remove('active-page'));

    function changeShapeTheme(shape) {
        shapeTheme = shape;        
        if (currentSpreadIndex > 0 && currentSpreadIndex <= Math.ceil(innerPageCount / 2)) {
            const leftPageIndex = (currentSpreadIndex - 1) * 2 + 1;
            const rightPageIndex = leftPageIndex + 1;

            const leftTpl = albumPagesData[leftPageIndex]?.template || 'free';
            const rightTpl = albumPagesData[rightPageIndex]?.template || 'free';

            if (leftTpl === 'fullSpread' || leftTpl === 'centerCross') {
                applyLayoutTemplate(leftTpl, true);
            } else {
                const origSelected = selectedPageIndex;
                
                if (leftTpl !== 'free') {
                    selectedPageIndex = leftPageIndex;
                    applyLayoutTemplate(leftTpl, true);
                }
                if (rightTpl !== 'free') {
                    selectedPageIndex = rightPageIndex;
                    applyLayoutTemplate(rightTpl, true);
                }
                
                selectedPageIndex = origSelected;
            }
        }
        renderBookView();
    }

    // 💡 [해결 2 & 3] 레이아웃 템플릿 적용 (파노라마 잔재 삭제 & 단일/양면 독립 적용)
    function applyLayoutTemplate(templateType, isSilent = false) {
        const maxSpreads = Math.floor(innerPageCount / 2) + 1;
        if (currentSpreadIndex === 0 || currentSpreadIndex > maxSpreads + 1) {
            if (!isSilent) {
                alert("속지 페이지(1p~10p)로 이동한 후 레이아웃 틀을 적용해 주세요!");
            }
            renderBookView();
            return;

        const leftPageIndex = (currentSpreadIndex - 1) * 2 + 1;
        const rightPageIndex = leftPageIndex + 1;

        const singlePageLayouts = ['free', 'grid4', 'hero1', 'diary', 'fullPage', 'photoStory'];
        const isSinglePageLayout = singlePageLayouts.includes(templateType);

        if (leftPageIndex > innerPageCount) {
            addNewSpread();

        let targetPageIndex = selectedPageIndex;

            targetPageIndex = leftPageIndex;

        const prevLeftTpl = albumPagesData[leftPageIndex]?.template || 'free';
        const prevRightTpl = albumPagesData[rightPageIndex]?.template || 'free';

            function buildSlots(layoutItems, existingSrcs, suffix) {
                let srcIdx = 0;
                const slots = layoutItems.map(function(item, idx) {
                    const id = (item.type === 'text' ? 'text_' : 'slot_') + Date.now() + '_' + suffix + '_' + idx;
                    if (item.type === 'text') {
                        return { id: id, type: 'text', text: item.text, top: item.top, left: item.left, width: item.width, height: item.height, rotation: 0 };
                    }
                    return { id: id, type: 'slot', label: item.label, top: item.top, left: item.left, width: item.width, height: item.height, src: existingSrcs[srcIdx++] || null };
                });
                const overflowSrcs = existingSrcs.slice(srcIdx).filter(Boolean);
                return { slots: slots, overflow: overflowSrcs };
            }

            if (isSinglePageLayout && !hadSpreadLayout) {
                const existingEls = albumPagesData[targetPageIndex].elements || [];
                const existingSrcs = existingEls.filter(el => el.type === 'slot').map(el => el.src);
                const existingImages = existingEls.filter(el => el.type === 'image');
                const existingTexts = existingEls.filter(el => el.type === 'text');

                const built = buildSlots(selectedLayout.left, existingSrcs, targetPageIndex);
                albumPagesData[targetPageIndex].elements = [...built.slots, ...existingImages, ...existingTexts];
                albumPagesData[targetPageIndex].template = templateType;
                addToOverflowShelf(built.overflow);
            } else {
                const existingLeftEls = albumPagesData[leftPageIndex].elements || [];
                const existingRightEls = albumPagesData[rightPageIndex].elements || [];
                const existingLeftSrcs = existingLeftEls.filter(el => el.type === 'slot').map(el => el.src);
                const existingRightSrcs = existingRightEls.filter(el => el.type === 'slot').map(el => el.src);
                const existingLeftImages = existingLeftEls.filter(el => el.type === 'image');
                const existingLeftTexts = existingLeftEls.filter(el => el.type === 'text');
                const existingRightImages = existingRightEls.filter(el => el.type === 'image');
                const existingRightTexts = existingRightEls.filter(el => el.type === 'text');

                const builtLeft = buildSlots(selectedLayout.left, existingLeftSrcs, 'L');
                albumPagesData[leftPageIndex].elements = [...builtLeft.slots, ...existingLeftImages, ...existingLeftTexts];
                addToOverflowShelf(builtLeft.overflow);

                const builtRight = buildSlots(selectedLayout.right, existingRightSrcs, 'R');
                albumPagesData[rightPageIndex].elements = [...builtRight.slots, ...existingRightImages, ...existingRightTexts];
                addToOverflowShelf(builtRight.overflow);

                albumPagesData[leftPageIndex].template = templateType;
                albumPagesData[rightPageIndex].template = templateType;
            }
        }

        selectPage(selectedPageIndex);

    function addToOverflowShelf(srcs) {
        const validSrcs = srcs.filter(Boolean);
        if (!validSrcs.length) return;

        // 현재 스프레드의 페이지 캔버스와 크기 파악
        const leftPageIndex  = currentSpreadIndex === 0 ? 0 : (currentSpreadIndex - 1) * 2 + 1;
        const rightPageIndex = leftPageIndex + 1;

        const shapeMap = { 'shape-portrait': { w: 436, h: 640 }, 'shape-square': { w: 480, h: 480 }, 'shape-landscape': { w: 550, h: 420 } };
        const dim = shapeMap[shapeTheme] || shapeMap['shape-portrait'];
        const thumbW = 100, thumbH = 80;

        // 배치 후보 canvas 목록 (좌·우 번갈아)
        const canvases = [
            { pIdx: leftPageIndex,  side: 'left'  },
            { pIdx: rightPageIndex, side: 'right' }
        ];

        validSrcs.forEach(function(src, i) {
            const target = canvases[i % 2];
            const pIdx   = target.pIdx;
            const canvas = document.getElementById('pageCanvas_' + pIdx);
            if (!canvas || !albumPagesData[pIdx]) return;

            // 흩뿌릴 위치: 좌우 페이지 바깥 가장자리에 걸치도록
            let top, left;
            const rand = function(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; };

            if (target.side === 'left') {
                // 왼쪽 페이지 왼쪽 바깥으로 삐져나오게
                left = rand(-thumbW + 20, -20);
                top  = rand(20, dim.h - thumbH - 20);
            } else {
                // 오른쪽 페이지 오른쪽 바깥으로 삐져나오게
                left = rand(dim.w - 40, dim.w + thumbW - 40);
                top  = rand(20, dim.h - thumbH - 20);
            }

            const elemData = {
                id: 'overflow_' + Date.now() + '_' + i,
                type: 'image',
                src: src,
                top: top,
                left: left,
                width: thumbW,
                height: thumbH,
                rotation: rand(-8, 8)
            };
            albumPagesData[pIdx].elements.push(elemData);
            renderSingleElement(canvas, elemData, pIdx);
        });
        renderEditorThumbs();
    }

    function addImageToActivePage(imgUrl) {
        // 표지(spread 0)는 pageCanvas_0 에 자유 배치
        if (currentSpreadIndex === 0) {
            const canvas = document.getElementById('pageCanvas_0');
            const elemData = {
                id: 'el_' + Date.now(),
                type: 'image',
                src: imgUrl,
                top: 40 + Math.floor(Math.random() * 60),
                left: 40 + Math.floor(Math.random() * 60),
                width: 180,
                rotation: 0
            };
            albumPagesData[0].elements.push(elemData);
            renderSingleElement(canvas, elemData, 0);
            renderEditorThumbs();
            return;
        }

        // 뒷표지 스프레드는 무시
        const maxSpread = Math.ceil(innerPageCount / 2);
        if (currentSpreadIndex > maxSpread) return;

        const leftPageIndex = (currentSpreadIndex - 1) * 2 + 1;
        const rightPageIndex = leftPageIndex + 1;

        // 선택된 페이지 우선, 없으면 반대쪽 빈 슬롯 탐색
        const pageOrder = selectedPageIndex === rightPageIndex
            ? [rightPageIndex, leftPageIndex]
            : [leftPageIndex, rightPageIndex];

        let emptySlot = null;
        for (const pIdx of pageOrder) {
            const found = (albumPagesData[pIdx] && albumPagesData[pIdx].elements || [])
                .find(el => el.type === 'slot' && !el.src);
            if (found) { emptySlot = { slot: found, pIdx }; break; }
        }

        if (emptySlot) {
            emptySlot.slot.src = imgUrl;
            renderBookView();
        } else {
            // 빈 슬롯 없으면 선택 페이지에 자유 배치
            const targetIdx = (selectedPageIndex === leftPageIndex || selectedPageIndex === rightPageIndex)
                ? selectedPageIndex : leftPageIndex;
            const canvas = document.getElementById(`pageCanvas_${targetIdx}`);
            const elemData = {
                id: 'el_' + Date.now(),
                type: 'image',
                src: imgUrl,
                top: 40 + Math.floor(Math.random() * 60),
                left: 40 + Math.floor(Math.random() * 60),
                width: 200,
                rotation: 0
            };
            albumPagesData[targetIdx].elements.push(elemData);
            renderSingleElement(canvas, elemData, targetIdx);
            renderEditorThumbs();
        }
    }

    function handlePhotoUpload(e) {
        const files = e.target.files;
        const tray = document.getElementById('photoTray');
        const countNotice = document.getElementById('photoCountNotice');

        if (files.length < 5 || files.length > 20) {
            alert("사진은 최소 5장에서 최대 20장까지 등록 가능합니다.");
        }

        tray.innerHTML = '';
        uploadedImageURLs = [];

        Array.from(files).forEach((file) => {
            const reader = new FileReader();
            reader.onload = event => {
                const url = event.target.result;
                uploadedImageURLs.push(url);

                const imgThumb = document.createElement('img');
                imgThumb.src = url;
                imgThumb.className = 'upload-thumb-img cursor-pointer';
                imgThumb.title = '클릭하여 빈 사진 틀에 순서대로 추가';
                imgThumb.onclick = () => addImageToActivePage(url);
                tray.appendChild(imgThumb);
            };
            reader.readAsDataURL(file);
        });

        countNotice.innerText = `현재 업로드된 사진: ${files.length}장`;
    }

    function startResizeElement(e, elemId, pageIdx) {
        e.preventDefault();
        e.stopPropagation();

        const wrapper = document.getElementById(elemId);
        if (!wrapper) return;

        const startX = e.clientX;
        const startY = e.clientY;
        const startWidth = wrapper.offsetWidth;
        const startHeight = wrapper.offsetHeight;

        const targetData = albumPagesData[pageIdx].elements.find(el => el.id === elemId);

        function doResize(moveEvent) {
            const newWidth = Math.max(60, startWidth + (moveEvent.clientX - startX));
            const newHeight = Math.max(40, startHeight + (moveEvent.clientY - startY));

            wrapper.style.width = newWidth + 'px';
            wrapper.style.height = newHeight + 'px';

            if (targetData) {
                targetData.width = newWidth;
                targetData.height = newHeight;
            }
        }

        function stopResize() {
            document.removeEventListener('mousemove', doResize);
            document.removeEventListener('mouseup', stopResize);
        }

        document.addEventListener('mousemove', doResize);
        document.addEventListener('mouseup', stopResize);
    }

    function renderSingleElement(parentCanvas, data, pageIdx) {
        if (!parentCanvas) return;
        const wrapper = document.createElement('div');
        wrapper.className = 'free-drag-element';
        wrapper.id = data.id;
        wrapper.style.top = data.top + 'px';
        wrapper.style.left = data.left + 'px';
        wrapper.style.width = data.width + 'px';
        if (data.height) wrapper.style.height = data.height + 'px';
        if (data.rotation) wrapper.style.transform = `rotate(${data.rotation}deg)`;

        if (data.type === 'slot') {
            var slotClipStyle = '';
            if (data.shape && data.shape !== 'rect') {
                var slotShapeObj = SHAPES.find(function(s) { return s.id === data.shape; });
                if (slotShapeObj) slotClipStyle = 'clip-path:' + slotShapeObj.clip + ';';

            if (data.src) {
                wrapper.innerHTML = `

                         ondragleave="handleSlotDragLeave(event)"

            wrapper.innerHTML = `
                <button type="button" class="elem-rotate-handle" onmousedown="startRotateElement(event, '${data.id}', ${pageIdx})" title="360도 회전">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
                <div contenteditable="false" class="editable-text-box${placeholderClass}" 
                     ondblclick="enableTextEdit(this)" 
                     onblur="disableTextEdit(this, '${data.id}', ${pageIdx})">${displayText}</div>
                <button type="button" class="elem-delete-btn" onclick="deleteElement('${data.id}', ${pageIdx})">&times;</button>
            `;
            makeDraggable(wrapper, pageIdx, data.id);
        }

        parentCanvas.appendChild(wrapper);
    }

    function startRotateElement(e, elemId, pageIdx) {
        e.preventDefault();
        e.stopPropagation();

        const wrapper = document.getElementById(elemId);
        if (!wrapper) return;

        const rect = wrapper.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const targetData = albumPagesData[pageIdx].elements.find(el => el.id === elemId);

        function doRotate(moveEvent) {
            const radians = Math.atan2(moveEvent.clientY - centerY, moveEvent.clientX - centerX);
            let degrees = Math.round(radians * (180 / Math.PI)) + 90;
            if (degrees < 0) degrees += 360;

            wrapper.style.transform = `rotate(${degrees}deg)`;
            if (targetData) targetData.rotation = degrees;
        }

        function stopRotate() {
            document.removeEventListener('mousemove', doRotate);
            document.removeEventListener('mouseup', stopRotate);
        }

        document.addEventListener('mousemove', doRotate);
        document.addEventListener('mouseup', stopRotate);
    }

    function handleSlotDragStart(e, slotId, pageIdx) {
        draggedSlotInfo = { slotId, pageIdx };
        e.dataTransfer.setData('text/plain', slotId);
        e.dataTransfer.effectAllowed = 'move';
    }

    function handleSlotDragOver(e) {
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';

        const card = e.currentTarget.classList.contains('photo-slot-card') ? e.currentTarget : e.currentTarget.closest('.photo-slot-card');
        if (card) card.classList.add('drag-over');
    }

    function handleSlotDragLeave(e) {
        e.preventDefault();
        const card = e.currentTarget.classList.contains('photo-slot-card') ? e.currentTarget : e.currentTarget.closest('.photo-slot-card');
        if (card) card.classList.remove('drag-over');
    }

    function handleSlotDrop(e, targetSlotId, targetPageIdx) {
        e.preventDefault();
        e.stopPropagation();

        const card = e.currentTarget.classList.contains('photo-slot-card') ? e.currentTarget : e.currentTarget.closest('.photo-slot-card');
        if (card) card.classList.remove('drag-over');

        if (!draggedSlotInfo) return;

        const srcPageIdx = draggedSlotInfo.pageIdx;
        const srcSlotId = draggedSlotInfo.slotId;

        if (srcPageIdx === targetPageIdx && srcSlotId === targetSlotId) return;

        const srcSlot = albumPagesData[srcPageIdx].elements.find(el => el.id === srcSlotId);
        const targetSlot = albumPagesData[targetPageIdx].elements.find(el => el.id === targetSlotId);

        if (srcSlot && targetSlot) {
            const tempSrc = srcSlot.src;
            srcSlot.src = targetSlot.src;
            targetSlot.src = tempSrc;

            draggedSlotInfo = null;
            renderBookView();
        }
    }

    function clearSlotImage(slotId, pageIdx) {
        const slot = albumPagesData[pageIdx].elements.find(el => el.id === slotId);
        if (slot) {
            slot.src = null;
            renderBookView();
        }
    }

    function restorePageElements(pageIdx) {
        const canvas = document.getElementById(`pageCanvas_${pageIdx}`);
        if (!canvas) return;
        albumPagesData[pageIdx].elements.forEach(data => {
            renderSingleElement(canvas, data, pageIdx);
        });
    }

    function makeDraggable(element, pageIdx, elemId) {
        let posX = 0, posY = 0, mouseX = 0, mouseY = 0;

        element.onmousedown = dragMouseDown;

        function dragMouseDown(e) {
            if (!element.classList.contains('selected')) {
                clearElementSelection();
                element.classList.add('selected');
                var elemData = albumPagesData[pageIdx] && albumPagesData[pageIdx].elements.find(function(el) { return el.id === elemId; });
                showShapeContextBar(elemId, pageIdx, elemData && elemData.shape);
            }

            if (e.target.classList.contains('elem-delete-btn') ||
                e.target.classList.contains('elem-rotate-handle') ||
                e.target.classList.contains('elem-resize-handle') ||
                e.target.classList.contains('shape-btn') ||
                e.target.closest('.elem-rotate-handle') ||
                e.target.closest('.elem-resize-handle') ||
                e.target.closest('.elem-shape-bar') ||
                e.target.classList.contains('slot-clear-btn') ||
                e.target.getAttribute('contenteditable') === 'true') return;

            e.preventDefault();
            mouseX = e.clientX;
            mouseY = e.clientY;

            element.style.zIndex = '9999';

            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e.preventDefault();
            posX = mouseX - e.clientX;
            posY = mouseY - e.clientY;
            mouseX = e.clientX;
            mouseY = e.clientY;

            const newTop = element.offsetTop - posY;
            const newLeft = element.offsetLeft - posX;

            element.style.top = newTop + "px";
            element.style.left = newLeft + "px";

            const targetData = albumPagesData[pageIdx].elements.find(el => el.id === elemId);
            if (targetData) {
                targetData.top = newTop;
                targetData.left = newLeft;
            }
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;

            element.style.zIndex = '30';

            const leftPageIndex = (currentSpreadIndex - 1) * 2 + 1;
            const rightPageIndex = leftPageIndex + 1;

            const leftCanvas = document.getElementById(`pageCanvas_${leftPageIndex}`);
            const rightCanvas = document.getElementById(`pageCanvas_${rightPageIndex}`);

            if (leftCanvas && rightCanvas) {
                const elemRect = element.getBoundingClientRect();
                const elemCenterX = elemRect.left + elemRect.width / 2;

                const leftRect = leftCanvas.getBoundingClientRect();
                const rightRect = rightCanvas.getBoundingClientRect();

                let targetPageIdx = pageIdx;
                let targetCanvas = (pageIdx === leftPageIndex) ? leftCanvas : rightCanvas;

                if (pageIdx === leftPageIndex && elemCenterX >= rightRect.left) {
                    targetPageIdx = rightPageIndex;
                    targetCanvas = rightCanvas;
                } 

                else if (pageIdx === rightPageIndex && elemCenterX <= leftRect.right) {
                    targetPageIdx = leftPageIndex;
                    targetCanvas = leftCanvas;
                }

                if (targetPageIdx !== pageIdx) {
                    const srcIndex = albumPagesData[pageIdx].elements.findIndex(el => el.id === elemId);
                    if (srcIndex !== -1) {
                        const [movedElem] = albumPagesData[pageIdx].elements.splice(srcIndex, 1);

                        const targetRect = targetCanvas.getBoundingClientRect();
                        const newCalculatedLeft = elemRect.left - targetRect.left;
                        const newCalculatedTop = elemRect.top - targetRect.top;

                        movedElem.left = newCalculatedLeft;
                        movedElem.top = newCalculatedTop;

                        albumPagesData[targetPageIdx].elements.push(movedElem);

                        targetCanvas.appendChild(element);
                        element.style.left = newCalculatedLeft + 'px';
                        element.style.top = newCalculatedTop + 'px';

                        makeDraggable(element, targetPageIdx, elemId);
                    }
                }
            }
        }
    }

    function updateTextContent(elemId, pageIdx, newText) {
        const targetData = albumPagesData[pageIdx].elements.find(el => el.id === elemId);
        if (targetData) targetData.text = newText;
    }

    function deleteElement(elemId, pageIdx) {
        albumPagesData[pageIdx].elements = albumPagesData[pageIdx].elements.filter(el => el.id !== elemId);
        const domEl = document.getElementById(elemId);
        if (domEl) domEl.remove();

    /** 스프레드 하나의 썸네일 HTML을 반환 */
    function buildThumbHTML(spreadIdx, totalSpreads, albumObj, isActive, onclickStr, thumbClass, spreadClass, pageClass, labelClass) {
        var coverColor = COVER_COLORS[albumObj.coverTheme] || '#4CAF50';
        var label, pagesHTML;

        if (spreadIdx === 0) {
            label = '커버';
            pagesHTML = '<div class="' + pageClass + ' is-single" style="background:' + coverColor + ';"></div>';
        } else if (spreadIdx === totalSpreads) {
            label = '뒤표지';
            pagesHTML = '<div class="' + pageClass + ' is-single" style="background:' + coverColor + ';opacity:.55;"></div>';
        } else {
            var lIdx = (spreadIdx - 1) * 2 + 1;
            var rIdx = lIdx + 1;
            label = lIdx + '-' + rIdx;
            var lEls = albumObj.pagesData[lIdx] ? albumObj.pagesData[lIdx].elements : [];
            var rEls = albumObj.pagesData[rIdx] ? albumObj.pagesData[rIdx].elements : [];
            var lImg = lEls.find(function(e) { return (e.type === 'slot' || e.type === 'image') && e.src; });
            var rImg = rEls.find(function(e) { return (e.type === 'slot' || e.type === 'image') && e.src; });
            var lStyle = lImg ? 'background-image:url("' + lImg.src.replace(/"/g, '&quot;') + '");' : 'background:#e8e8e8;';
            var rStyle = rImg ? 'background-image:url("' + rImg.src.replace(/"/g, '&quot;') + '");' : 'background:#e8e8e8;';
            pagesHTML = '<div class="' + pageClass + '" style="' + lStyle + '"></div>'
                      + '<div class="av-spine"></div>'
                      + '<div class="' + pageClass + '" style="' + rStyle + '"></div>';
        }

        return '<div class="' + thumbClass + (isActive ? ' is-active' : '') + '" onclick="' + onclickStr + '">'
            + '<div class="' + spreadClass + '">' + pagesHTML + '</div>'
            + '<div class="' + labelClass + '">' + esc(label) + '</div>'
            + '</div>';
    }

    /** 뷰어 책 스프레드 렌더링 */
    function renderViewerBook() {
        if (!viewerAlbum) return;
        var container = document.getElementById('av-book-container');
        var stage = document.getElementById('av-book-stage');
        var totalSpreads = Math.ceil(viewerAlbum.innerPageCount / 2) + 1;

        // 크기 설정
        if (stage) {
            if (viewerAlbum.shapeTheme === 'shape-square') stage.style.width = '962px';
            else if (viewerAlbum.shapeTheme === 'shape-landscape') stage.style.width = '1102px';
            else stage.style.width = '874px';
        }

        // 앞/뒤 버튼
        document.getElementById('av-prev-btn').disabled = (viewerSpreadIdx === 0);
        document.getElementById('av-next-btn').disabled = (viewerSpreadIdx === totalSpreads);

        // 뷰포트에 맞게 책 스테이지 스케일 조정
        requestAnimationFrame(function() {
            if (!stage) return;
            var stageW = parseFloat(stage.style.width) || 874;
            var maxW = window.innerWidth - 160; // nav 버튼 + 여백
            var maxH = window.innerHeight - 260; // 제목 + 썸네일 + 여백
            var scaleW = maxW / stageW;
            // 책 높이 추정 (portrait: 640, square: 480, landscape: 420)
            var bookH = viewerAlbum.shapeTheme === 'shape-portrait' ? 640 : viewerAlbum.shapeTheme === 'shape-square' ? 480 : 420;
            var scaleH = maxH / bookH;
            var scale = Math.min(1, scaleW, scaleH);
            stage.style.transform = scale < 1 ? 'scale(' + scale.toFixed(3) + ')' : '';
            stage.style.transformOrigin = 'top center';
            // 실제 점유 높이 보정
            stage.style.height = scale < 1 ? Math.round(bookH * scale) + 'px' : '';
        });

        container.className = 'book-container '
            + viewerAlbum.coverTheme + ' '
            + (viewerAlbum.paperTheme || 'paper-white') + ' '
            + (viewerAlbum.shapeTheme || 'shape-portrait')
            + (viewerSpreadIdx === 0 || viewerSpreadIdx === totalSpreads ? ' is-closed' : '');

        container.innerHTML = '';

        if (viewerSpreadIdx === 0) {
            container.innerHTML = '<div class="book-page single-page book-cover-page" style="position:relative;">'
                + '<div class="cover-emboss-border text-center p-4 w-100 h-100 d-flex flex-column align-items-center justify-content-center" style="pointer-events:none;">'
                + '<i class="fa-solid fa-camera-retro fa-4x mb-4 text-gold"></i>'
                + '<h3 class="font-weight-bold text-gold mb-3">' + esc(viewerAlbum.title || '') + '</h3>'
                + '<p class="small text-gold mb-0">FarmLink Memory Photo Book</p>'
                + '</div></div>';
            var cv0 = container.querySelector('.book-cover-page');
            if (cv0) renderPageElementsStatic(cv0, viewerAlbum.pagesData[0] ? viewerAlbum.pagesData[0].elements : []);

        } else if (viewerSpreadIdx === totalSpreads) {
            container.innerHTML = '<div class="book-page single-page book-cover-page d-flex flex-column align-items-center justify-content-center p-4">'
                + '<div class="text-center text-gold"><i class="fa-solid fa-heart fa-3x mb-3"></i>'
                + '<h4 class="font-weight-bold">소중한 순간을 기억하며</h4>'
                + '<p class="small opacity-75">FarmLink Travel Archive</p></div></div>';

        } else {
            var lIdx = (viewerSpreadIdx - 1) * 2 + 1;
            var rIdx = lIdx + 1;
            container.innerHTML = '<div class="book-page left-page" id="av-pageL" style="position:relative;">'
                + '<span class="page-num-tag">' + lIdx + 'p</span></div>'
                + '<div class="book-spine"></div>'
                + '<div class="book-page right-page" id="av-pageR" style="position:relative;">'
                + '<span class="page-num-tag">' + rIdx + 'p</span></div>';
            var lCanvas = document.getElementById('av-pageL');
            var rCanvas = document.getElementById('av-pageR');
            if (lCanvas) renderPageElementsStatic(lCanvas, viewerAlbum.pagesData[lIdx] ? viewerAlbum.pagesData[lIdx].elements : []);
            if (rCanvas) renderPageElementsStatic(rCanvas, viewerAlbum.pagesData[rIdx] ? viewerAlbum.pagesData[rIdx].elements : []);
        }

        // 썸네일 active 갱신
        renderViewerThumbs();
    }

    /** 뷰어용 페이지 요소 정적 렌더링 (핸들 없음, pointer-events:none) */
    function renderPageElementsStatic(canvas, elements) {
        if (!elements || !elements.length) return;
        elements.forEach(function(data) {
            if (!data.src && data.type !== 'text') return; // src 없는 슬롯은 스킵
            var wrapper = document.createElement('div');
            wrapper.style.cssText = 'position:absolute;top:' + data.top + 'px;left:' + data.left + 'px;'
                + 'width:' + data.width + 'px;'
                + (data.height ? 'height:' + data.height + 'px;' : '')
                + (data.rotation ? 'transform:rotate(' + data.rotation + 'deg);' : '')
                + 'overflow:hidden;pointer-events:none;';

            var clipStyle = '';
            if (data.shape && data.shape !== 'rect') {
                var shapeObj = SHAPES.find(function(s) { return s.id === data.shape; });
                if (shapeObj) clipStyle = 'clip-path:' + shapeObj.clip + ';';
            }

            if (data.type === 'slot' && data.src) {
                wrapper.innerHTML = '<img src="' + data.src + '" style="width:100%;height:100%;object-fit:cover;border-radius:6px;' + clipStyle + '">';
            } else if (data.type === 'image' && data.src) {
                wrapper.innerHTML = '<img src="' + data.src + '" style="width:100%;height:100%;object-fit:cover;border-radius:4px;' + clipStyle + '">';
            } else if (data.type === 'text') {
                wrapper.innerHTML = '<div style="width:100%;height:100%;padding:8px;font-size:.85rem;white-space:pre-wrap;overflow:hidden;word-break:break-word;">' + esc(data.text || '') + '</div>';
            }
            canvas.appendChild(wrapper);
        });
    }

            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, logging: false },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
            pagebreak: { mode: 'always' }
        };

        html2pdf().set(opt).from(tempContainer).save().then(() => {
            document.body.removeChild(tempContainer);

            btn.innerHTML = originalHTML;
            btn.disabled = false;
        });
