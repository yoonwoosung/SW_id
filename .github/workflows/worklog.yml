name: Worklog to Notion

# develop push / develop 대상 PR 때마다 pytest 를 돌리고, 변경 메트릭과 함께
# 노션 "작업/배포 로그" DB에 row 1건을 기록한다. (K-OSP 파이프라인과 같은 DB·스키마, 프로젝트=FarmLink)
#
# 필요한 시크릿: NOTION_TOKEN, NOTION_DB_ID  (K-OSP-Frontend 와 같은 값)
# 노션 쪽: DB 페이지 ··· → Connections 에 integration "KOSP" 가 연결돼 있어야 한다(이미 연결됨).
on:
  pull_request:
    types: [opened, closed]
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: worklog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      test_passed: ${{ steps.result.outputs.test_passed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-deploy.txt pytest
      - name: pytest
        id: pytest
        # tests/conftest.py 가 SQLite 메모리 DB로 바꿔 주므로 MySQL 없이 돈다.
        run: pytest -q --no-header -p no:cacheprovider
        continue-on-error: true
      - name: Mark test result
        id: result
        if: always()
        run: echo "test_passed=${{ steps.pytest.outcome == 'success' }}" >> "$GITHUB_OUTPUT"

  record:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute change metrics
        id: metrics
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$HEAD~1"
          fi
          FILES="$(git diff --name-only "$BASE" "$HEAD" || true)"
          count() { printf '%s\n' "$FILES" | grep -cE "$1" || true; }

          # Flask 구조에 맞춘 분류 (K-OSP 의 java/src/flyway 대응)
          BACKEND=$(count '^(routes|services|external|common|app\.py)')
          FRONTEND=$(count '^(templates|static|css|js)/')
          ENTITY_DTO=$(count '^models/')
          MIGRATION=$(count '^(data/|seed_|deploy_setup)')
          TOTAL=$(printf '%s\n' "$FILES" | grep -c . || true)

          TYPE=$(git log -1 --pretty=%s "$HEAD" | grep -oiE '^(feat|fix|docs|refactor|chore|test|style|perf|ci)' | head -1 | tr 'A-Z' 'a-z')
          [ -z "$TYPE" ] && TYPE="chore"
          {
            echo "backend=$BACKEND"; echo "frontend=$FRONTEND"; echo "entity_dto=$ENTITY_DTO"
            echo "migration=$MIGRATION"; echo "total=$TOTAL"; echo "type=$TYPE"
          } >> "$GITHUB_OUTPUT"

      - name: Push to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          PROJECT_NAME: FarmLink
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          WORK_TYPE: ${{ steps.metrics.outputs.type }}
          BACKEND_FILES: ${{ steps.metrics.outputs.backend }}
          FRONTEND_FILES: ${{ steps.metrics.outputs.frontend }}
          ENTITY_DTO_FILES: ${{ steps.metrics.outputs.entity_dto }}
          MIGRATION_FILES: ${{ steps.metrics.outputs.migration }}
          TOTAL_FILES: ${{ steps.metrics.outputs.total }}
          TEST_PASSED: ${{ needs.test.outputs.test_passed }}
        run: node .github/scripts/notion-log.mjs
